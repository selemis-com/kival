[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = [
    "bin/kival",
    "bin/kivald",
    "crates/cli",
    "crates/common",
    "crates/kernel",
    "crates/metrics",
    "crates/server",
    "crates/storage",
    "crates/tasks",
    "crates/tests",
    "crates/types",
    "crates/tracing",
    "sdk/rust",
]
default-members = ["bin/kival", "bin/kivald"]

# Lints for the entire workspace.
[workspace.lints.rust]
closure_returning_async_block = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_must_use = "deny"
unused_qualifications = "warn"
variant_size_differences = "warn"

# These are Rust lints we want to enable from time to time but do not want to
# strictly enforce. We can enable them in the future if we want to.
# let_underscore_drop = "warn"
# unused_results = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
cargo_common_metadata = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
future_not_send = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
implicit_hasher = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_futures = "warn"
large_stack_frames = "warn"
manual_assert = "warn"
manual_is_power_of_two = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_type_cast = "warn"
option_as_ref_cloned = "warn"
option_if_let_else = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pub_without_shorthand = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
redundant_test_prefix = "warn"
redundant_type_annotations = "warn"
ref_as_ptr = "warn"
ref_binding_to_reference = "warn"
ref_option = "warn"
ref_option_ref = "warn"
ref_patterns = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
significant_drop_tightening = "warn"
single_char_pattern = "warn"
str_to_string = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
struct_excessive_bools = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
tests_outside_test_module = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
uninhabited_references = "warn"
unnecessary_safety_comment = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unseparated_literal_suffix = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
use_debug = "warn"
use_self = "warn"
used_underscore_binding = "warn"
used_underscore_items = "warn"
useless_let_if_seq = "warn"
verbose_bit_mask = "warn"
verbose_file_reads = "warn"
volatile_composites = "warn"
while_float = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
with_capacity_zero = "warn"
zero_sized_map_values = "warn"

# These are Clippy lints we want to enable from time to time but do not want to
# strictly enforce. We can enable them in the future if we want to.
# absolute_paths = "warn"
# as_conversions = "warn"
# redundant_pub_crate = "warn"
# unused_async = "warn"
# unused_async_trait_impl = "warn"
# unwrap_used = "warn"
# wildcard_enum_match_arm = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[profile.bench]
inherits = "profiling"

[workspace.dependencies]
# Vendor
argx = { version = "0.2.2", features = ["chrono", "url", "uuid", "toml"] }
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.0"
ciborium = "0.2.2"
coset = "0.4.2"
eyre = "0.6.12"
futures-util = { version = "0.3.32", default-features = false, features = [
    "std",
] }
getrandom = "0.4.2"
object_store = { version = "0.14.1", default-features = false, features = ["fs"] }
hex = "0.4.3"
http = "1.4.1"
libc = { version = "0.2.186", default-features = false }
proc-macro2 = "1.0.106"
proptest = "1.11.0"
proptest-state-machine = "0.8.0"
quote = "1.0.46"
reqwest = { version = "0.13.4", default-features = false }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
schemars = { version = "1.2.1", features = ["chrono04", "derive", "uuid1", "url2"] }
sha2 = "0.11.0"
steda = { version = "0.1.0", default-features = false }
syn = "2.0.118"
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "uuid",
  "json",
  "chrono"
] }
tempfile = "3.27.0"
thiserror = "2.0.18"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.52.3", default-features = false }
tokio-util = { version = "0.7.18", default-features = false }
toml = "1.1.2"
tower = "0.5.3"
tower-http = { version = "0.7.0", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = [
    "attributes",
    "std",
] }
tracing-appender = "0.2.5"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "2.5.8"
uuid = { version = "1.23.2", features = ["serde"] }

# Crates
kival = { path = "bin/kival" }
kivald = { path = "bin/kivald" }
kival-cli = { path = "crates/cli" }
kival-common = { path = "crates/common" }
kival-kernel = { path = "crates/kernel" }
kival-metrics = { path = "crates/metrics" }
kival-server = { path = "crates/server" }
kival-storage = { path = "crates/storage" }
kival-tasks = { path = "crates/tasks" }
kival-tests = { path = "crates/tests" }
kival-types = { path = "crates/types", version = "0.1.0" }
kival-tracing = { path = "crates/tracing" }

# SDK
kival-sdk = { path = "sdk/rust", default-features = false }
