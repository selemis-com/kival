name: Documentation
description: Suggest a change to our documentation
labels: ["documentation", "needs triage"]
body:
  - type: textarea
    attributes:
      label: Describe the change
      description: |
        Please describe the documentation you want to change or add.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, such as screenshots or related resources.
