name: kival

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kival
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in etc/.env}
      POSTGRES_DB: kival
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kival -d kival"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 1m
    networks:
      - backend

  kival:
    image: ghcr.io/selemis-com/kival:${KIVAL_VERSION:?set KIVAL_VERSION in etc/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kival:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in etc/.env}@postgres:5432/kival
      KIVAL_CANONICAL_URL: ${KIVAL_CANONICAL_URL:?set KIVAL_CANONICAL_URL in etc/.env}
      KIVAL_ALLOWED_ORIGINS: ${KIVAL_ALLOWED_ORIGINS:-}
      KIVAL_DATABASE_MAX_CONNECTIONS: ${KIVAL_DATABASE_MAX_CONNECTIONS:-8}
      KIVAL_DATABASE_ACQUIRE_TIMEOUT_SECONDS: ${KIVAL_DATABASE_ACQUIRE_TIMEOUT_SECONDS:-5}
      KIVAL_PASSKEY_START_REQUESTS_PER_MINUTE: ${KIVAL_PASSKEY_START_REQUESTS_PER_MINUTE:-30}
      KIVAL_PASSKEY_FINISH_REQUESTS_PER_MINUTE: ${KIVAL_PASSKEY_FINISH_REQUESTS_PER_MINUTE:-15}
      KIVAL_API_KEY_AUTHENTICATION_ATTEMPTS_PER_MINUTE: ${KIVAL_API_KEY_AUTHENTICATION_ATTEMPTS_PER_MINUTE:-1200}
      KIVAL_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS: ${KIVAL_GRACEFUL_SHUTDOWN_TIMEOUT_SECONDS:-30}
    command:
      - --datadir
      - /var/lib/kival
      - --log.stdout.format
      - json
      - --log.file.format
      - json
      - --log.file.directory
      - /var/log/kival
      - --color
      - never
      - serve
      - --listen
      - 0.0.0.0:3000
      - --metrics
      - --metrics-address
      - 0.0.0.0:9001
    volumes:
      - kival-data:/var/lib/kival
      - kival-logs:/var/log/kival
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 45s
    networks:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    depends_on:
      kival:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - backend

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - kival-logs:/var/log/kival:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in etc/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - backend
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres-data:
  kival-data:
  kival-logs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
