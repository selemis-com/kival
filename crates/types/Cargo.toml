[package]
name = "kival-types"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
publish = true
description = "Canonical API and wire types for the Kival collaborative knowledge system."
repository = "https://github.com/selemis-com/kival"
homepage = "https://selemis.com"
documentation = "https://docs.rs/kival-types"
keywords = ["api", "types", "schema", "serde", "knowledge"]
categories = ["data-structures"]

[lints]
workspace = true

[features]
default = []
wire = ["dep:schemars", "dep:serde"]

[dependencies]
# Vendor
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
uuid.workspace = true
